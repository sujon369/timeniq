<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DEF={lang:'bn',theme:'system',h24:false,name:'Sujon',off:6,fdw:0,goal:120,sound:true,nsnd:'Chime',col:false,cats:{},alarms:[],tasks:[],study:[],work:[],routines:[],notes:[],fired:[],
pray:{city:'Rajshahi',lat:24.37,lng:88.6,method:'Karachi',madhab:'Hanafi',adv:10,on:{}},tm:{mode:'pomo',run:false,start:0,acc:0,dur:25,sb:5,lb:15,cdm:45,phase:'study',cnt:0}};
let S;
function fix(){['alarms','tasks','study','work','routines','notes','fired'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});S.pray={...DEF.pray,...S.pray};S.tm={...DEF.tm,...S.tm};if(typeof S.cats!=='object'||!S.cats)S.cats={}}
try{const raw=localStorage.getItem('timeniq');try{S={...DEF,...JSON.parse(raw||'{}')}}catch(e){localStorage.setItem('timeniq_bad',raw);S={...DEF}}}catch(e){S={...DEF}}
fix();const save=()=>{try{localStorage.setItem('timeniq',JSON.stringify(S))}catch(e){toast('Storage unavailable')}};
const L={dash:['ড্যাশবোর্ড','Dashboard'],alarms:['অ্যালার্ম','Alarms'],study:['স্টাডি টাইমার','Study Timer'],prayer:['নামাজের সময়','Prayer Times'],tasks:['টাস্ক','Tasks'],work:['কাজের সূচি','Work Schedule'],routines:['রুটিন','Routines'],cal:['ক্যালেন্ডার','Calendar'],stats:['বিশ্লেষণ','Analytics'],set:['সেটিংস','Settings'],more:['আরও','More']};
const tr=(e,b)=>S.lang==='bn'?b:e,t=k=>L[k][S.lang==='bn'?0:1];
const ICO={home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',timer:'<path d="M10 2h4"/><path d="m12 14 3-3"/><circle cx="12" cy="14" r="8"/>',moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',check:'<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',brief:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',chart:'<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',plus:'<path d="M5 12h14M12 5v14"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]}</svg>`;
const NAV=[['dash','home'],['alarms','bell'],['study','timer'],['prayer','moon'],['tasks','check'],['work','brief'],['routines','list'],['cal','cal'],['stats','chart'],['set','gear']],BN=['dash','alarms','tasks','prayer'];
/* time: "shifted clock" = UTC fields hold local time for chosen offset */
const nowD=()=>new Date(Date.now()+S.off*36e5),ymd=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()),hm=d=>pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());
const addD=(d,n)=>new Date(d.getTime()+n*864e5),toD=(ds,t)=>new Date(Date.parse(ds+'T'+(t||'00:00')+':00Z')),toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const fmtT=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return S.h24?t:(h%12||12)+':'+pad(m)+' '+(h<12?'AM':'PM')};
const cd=ms=>{const s=Math.max(0,Math.floor(ms/1e3));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
const clkTxt=()=>{const n=nowD(),h=n.getUTCHours(),s=pad(n.getUTCSeconds());return S.h24?pad(h)+':'+pad(n.getUTCMinutes())+':'+s:(h%12||12)+':'+pad(n.getUTCMinutes())+':'+s+' '+(h<12?'AM':'PM')};
/* audio + notifications */
let ac;function beep(k='Classic'){if(!S.sound)return;const d=SND[k]||SND.Classic;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();d.n.forEach((f,i)=>{if(!f)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.28;o.type=d.w;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.26);o.start(t);o.stop(t+.27)})}catch(e){}}
function toast(m){const e=document.createElement('div');e.className='ts';e.textContent=m;$('#ts').append(e);setTimeout(()=>e.remove(),3500)}
const fired=new Set(S.fired);
function notify(cat,title,body,key){if(key){if(fired.has(key))return;fired.add(key);S.fired=[...fired].slice(-100)}if(S.cats[cat]===false)return;S.notes.unshift({id:uid(),cat,title,body,ts:Date.now()});S.notes=S.notes.slice(0,50);save();toast(title+(body?' — '+body:''));if(cat!=='alarm')beep(S.nsnd);try{if(window.Notification&&Notification.permission==='granted')new Notification(title,{body})}catch(e){}}
function askN(){if(!window.Notification){toast('Notifications not supported here');return}Notification.requestPermission().then(()=>render()).catch(()=>toast('Permission request failed'))}
/* prayer times (astronomical calculation) */
const PN=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'],PB=['ফজর','সূর্যোদয়','যোহর','আসর','মাগরিব','এশা'],pn=p=>S.lang==='bn'?PB[PN.indexOf(p)]:p;
const MET={MWL:[18,17],Karachi:[18,18],ISNA:[15,15],Egypt:[19.5,17.5]};
const CT={Dhaka:[23.81,90.41],Chattogram:[22.36,91.78],Rajshahi:[24.37,88.6],Khulna:[22.85,89.54],Barishal:[22.7,90.37],Sylhet:[24.9,91.87],Rangpur:[25.74,89.25],Mymensingh:[24.75,90.41],Cumilla:[23.46,91.18],Bogura:[24.85,89.37]};
function ptimes(ds){const p=S.pray,[y,m,d]=ds.split('-').map(Number),r=Math.PI/180,D=Date.UTC(y,m-1,d,12)/864e5-10957.5,g=(357.529+.98560028*D)*r,q=((280.459+.98564736*D)%360+360)%360,L=(q+1.915*Math.sin(g)+.02*Math.sin(2*g))*r,e=23.439*r,ra=((Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/r/15)%24+24)%24,dc=Math.asin(Math.sin(e)*Math.sin(L)),lat=p.lat*r;
let eq=q/15-ra;eq=eq>12?eq-24:eq<-12?eq+24:eq;const nn=12+S.off-p.lng/15-eq,den=Math.cos(lat)*Math.cos(dc),ang=a=>Math.acos((Math.sin(-a*r)-Math.sin(lat)*Math.sin(dc))/den)/r/15,
A=Math.atan(1/((p.madhab==='Hanafi'?2:1)+Math.tan(Math.abs(lat-dc)))),asr=Math.acos((Math.sin(A)-Math.sin(lat)*Math.sin(dc))/den)/r/15,[fa,ia]=MET[p.method]||MET.Karachi;
const f=x=>{const mm=Math.round((((x%24)+24)%24)*60);return pad(Math.floor(mm/60)%24)+':'+pad(mm%60)};
try{return{Fajr:f(nn-ang(fa)),Sunrise:f(nn-ang(.833)),Dhuhr:f(nn+.02),Asr:f(nn+asr),Maghrib:f(nn+ang(.833)),Isha:f(nn+ang(ia))}}catch(e){return null}}
function nextP(){const n=nowD();for(let k=0;k<2;k++){const ds=ymd(addD(n,k)),P=ptimes(ds);if(!P)return{n:'Fajr',t:'--:--',ms:n};for(const x of PN)if(x!=='Sunrise'&&toD(ds,P[x])>n)return{n:x,t:P[x],ms:toD(ds,P[x])}}return{n:'Fajr',t:'--:--',ms:n}}
/* data helpers */
const occ=(a,ds)=>a.days&&a.days.length?a.days.includes(toD(ds).getUTCDay()):a.date===ds;
function wocc(w,ds){if(!w.date||ds<w.date)return false;const d=toD(ds).getUTCDay();return w.repeat==='Daily'||(w.repeat==='Weekdays (Sun–Thu)'&&d<5)||(w.repeat==='Weekly'&&d===toD(w.date).getUTCDay())||w.date===ds}
function itemsOn(ds){const dow=toD(ds).getUTCDay(),o=[];
S.alarms.forEach(a=>a.on&&occ(a,ds)&&o.push({k:'A',time:a.time,x:a.label||'Alarm'}));
S.tasks.forEach(k=>k.date===ds&&o.push({k:'T',time:k.time||'',x:k.title,d:k.done}));
S.study.forEach(s=>s.d===ds&&o.push({k:'S',time:s.t,x:'Study '+Math.round(s.sec/60)+' min'}));
S.work.forEach(w=>wocc(w,ds)&&o.push({k:'W',time:w.start,x:w.title+' ('+w.type+')'}));
S.routines.forEach(r=>!r.paused&&r.days.includes(dow)&&o.push({k:'R',time:r.start,x:r.name}));
return o.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}
function nextA(){const n=nowD();let best=null;S.alarms.forEach(a=>{if(!a.on)return;for(let k=0;k<8;k++){const ds=ymd(addD(n,k));if(occ(a,ds)&&toD(ds,a.time)>n){const ms=toD(ds,a.time);if(!best||ms<best.ms)best={a,ms};break}}});return best}
const ssum=ds=>S.study.filter(s=>s.d===ds).reduce((x,s)=>x+s.sec,0);
function score(){const ds=ymd(nowD()),tk=S.tasks.filter(k=>k.date===ds||k.doneAt===ds),dn=tk.filter(k=>k.done).length;return Math.round((tk.length?dn/tk.length:0)*50+Math.min(ssum(ds)/60/S.goal,1)*50)}
const greet=()=>{const h=nowD().getUTCHours();return S.lang==='bn'?(h<12?'শুভ সকাল':h<16?'শুভ দুপুর':h<19?'শুভ বিকেল':'শুভ সন্ধ্যা'):(h<12?'Good morning':h<17?'Good afternoon':'Good evening')};
/* dialogs and forms */
function dlg(inner){const d=document.createElement('dialog');d.innerHTML=inner;d.onclick=e=>{if(e.target.dataset&&e.target.dataset.x!==undefined)d.close()};d.onclose=()=>d.remove();document.body.append(d);d.showModal();return d}
function form(title,F,v,ok){const d=dlg(`<form><h2 style="margin:0 0 6px;font-size:18px">${title}</h2>${F.map(f=>{const val=v[f.k]??'',n=`name="${f.k}"`;
if(f.t==='days')return`<label>${f.l}</label><div class="row">${DAYS.map((x,i)=>`<label class="chip"><input type="checkbox" name="${f.k}" value="${i}" ${(v[f.k]||[]).includes(i)?'checked':''}>${x}</label>`).join('')}</div>`;
if(f.t==='check')return`<label class="row"><input type="checkbox" style="width:24px;min-height:24px" ${n} ${val?'checked':''}> ${f.l}</label>`;
if(f.t==='select')return`<label>${f.l}<select ${n}>${f.o.map(o=>`<option ${o==val?'selected':''}>${o}</option>`).join('')}</select></label>`;
if(f.t==='area')return`<label>${f.l}<textarea ${n} rows="2">${esc(val)}</textarea></label>`;
return`<label>${f.l}<input ${n} type="${f.t||'text'}" value="${esc(val)}" ${f.r?'required':''} ${f.t==='number'?'min="1"':''}></label>`}).join('')}
<div class="row mt"><button class="btn pri" type="submit">Save</button><button class="btn" type="button" data-x>Cancel</button></div></form>`);
d.querySelector('form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),o={};F.forEach(f=>{o[f.k]=f.t==='days'?fd.getAll(f.k).map(Number):f.t==='check'?fd.has(f.k):f.t==='number'?+fd.get(f.k):fd.get(f.k)});d.close();ok(o)}}
function edit(key,id,F,def,title,pre){const old=id?S[key].find(x=>x.id===id):0;form(title,F,old||def,o=>{pre&&pre(o);if(old)Object.assign(old,o);else S[key].push({id:uid(),...o});save();render()})}
function del(key,id){if(confirm('Delete this item? This cannot be undone.')){S[key]=S[key].filter(x=>x.id!==id);save();render()}}
/* alarms */
const SND={Classic:{n:[880,880,880],w:'sine'},High:{n:[1175,1175,1175],w:'sine'},Low:{n:[523,523,523],w:'sine'},Digital:{n:[1000,0,1000,0,1000],w:'square'},Chime:{n:[523,659,784,1047],w:'triangle'},Bell:{n:[784,988,784,988],w:'triangle'},Rise:{n:[440,554,659,880],w:'sawtooth'},Melody:{n:[659,784,880,784,659],w:'sine'},Soft:{n:[392,494,392],w:'sine'}},RD={'Daily':[0,1,2,3,4,5,6],'Weekdays (Sun–Thu)':[0,1,2,3,4],'Weekend (Fri–Sat)':[5,6]};
const AF=[{k:'time',l:'Time',t:'time',r:1},{k:'label',l:'Label'},{k:'rep',l:'Repeat',t:'select',o:['Once','Daily','Weekdays (Sun–Thu)','Weekend (Fri–Sat)','Custom']},{k:'date',l:'Date (for Once)',t:'date'},{k:'days',l:'Custom days',t:'days'},{k:'snooze',l:'Snooze (minutes)',t:'number'},{k:'snd',l:'Sound',t:'select',o:Object.keys(SND)}];
const editA=id=>edit('alarms',id,AF,{rep:'Daily',snooze:5,snd:'Classic',time:'06:00'},'Alarm',o=>{o.days=o.rep==='Custom'?o.days:RD[o.rep]||[];if(o.rep==='Once'&&!o.date){const n=nowD();o.date=ymd(o.time>hm(n)?n:addD(n,1))}if(o.rep!=='Once')o.date='';o.on=true;o.last='';o.snz=0});
const atog=id=>{const a=S.alarms.find(x=>x.id===id);a.on=!a.on;save();render()};
let rg=null,rt;
function ring(a){rg=a;const o=$('#rg');o.hidden=false;o.innerHTML=`<div style="font-size:56px;font-weight:700">${fmtT(a.time)}</div><div style="font-size:22px">${esc(a.label||'Alarm')}</div><div class="row" style="justify-content:center"><button class="btn" onclick="stopR(1)">Snooze ${a.snooze||5} min</button><button class="btn" onclick="stopR()">Stop</button></div>`;clearInterval(rt);beep(a.snd);rt=setInterval(()=>beep(a.snd),2500);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}notify('alarm','⏰ '+(a.label||'Alarm'),fmtT(a.time));if(a.rep==='Once')a.on=false;save();o.querySelector('button').focus()}
function stopR(s){clearInterval(rt);$('#rg').hidden=true;if(s&&rg)rg.snz=Date.now()+(rg.snooze||5)*6e4;rg=null;save();render()}
/* tasks */
const TF={f:'all',q:'',s:'Due date'},CATS=['Study','Work','Prayer','Personal','Health','Other'],PRI=['Low','Medium','High','Urgent'];
const TFm=[{k:'title',l:'Title',r:1},{k:'desc',l:'Description',t:'area'},{k:'date',l:'Due date',t:'date'},{k:'time',l:'Due time',t:'time'},{k:'cat',l:'Category',t:'select',o:CATS},{k:'pri',l:'Priority',t:'select',o:PRI},{k:'rec',l:'Repeat',t:'select',o:['None','Daily','Weekly']},{k:'rem',l:'Remind me at due time',t:'check'}];
const editT=(id,d)=>edit('tasks',id,TFm,{cat:'Study',pri:'Medium',rec:'None',rem:true,...d},'Task',o=>{if(!id)o.done=false});
const isOver=k=>!k.done&&k.date&&toD(k.date,k.time||'23:59')<nowD();
function tdone(id){const k=S.tasks.find(x=>x.id===id);if(!k)return;const td=ymd(nowD());if(!k.done&&k.rec!=='None'){S.tasks.push({...k,id:uid(),rec:'None',done:true,doneAt:td});k.date=ymd(addD(toD(k.date||td),k.rec==='Daily'?1:7))}else{k.done=!k.done;k.doneAt=k.done?td:''}save();render()}
function tlist(){const td=ymd(nowD());let a=S.tasks.filter(k=>({all:1,today:k.date===td&&!k.done,upcoming:!k.done&&k.date>td,completed:k.done,overdue:isOver(k)})[TF.f]&&(k.title+' '+(k.desc||'')).toLowerCase().includes(TF.q.toLowerCase()));
a.sort((x,y)=>TF.s==='Priority'?PRI.indexOf(y.pri)-PRI.indexOf(x.pri):TF.s==='Title'?x.title.localeCompare(y.title):((x.date||'9')+(x.time||'')).localeCompare((y.date||'9')+(y.time||'')));
return a.length?a.map(k=>`<div class="card row mt"><button class="ck" role="checkbox" aria-checked="${!!k.done}" aria-label="Complete: ${esc(k.title)}" onclick="tdone('${k.id}')">${k.done?'✓':''}</button><div class="sp"><div class="${k.done?'dn':''}"><b>${esc(k.title)}</b></div><div class="m">${esc(k.desc||'')}</div><div class="row"><span class="bd">${k.cat}</span><span class="bd">${k.pri}</span>${k.date?`<span class="bd">${k.date} ${fmtT(k.time)}</span>`:''}${k.rec!=='None'?`<span class="bd">↻ ${k.rec}</span>`:''}${isOver(k)?'<span class="bd dg">⚠ Overdue</span>':''}</div></div><button class="ib" aria-label="Edit" onclick="editT('${k.id}')">✎</button><button class="ib dg" aria-label="Delete" onclick="del('tasks','${k.id}')">${ic('trash')}</button></div>`).join(''):'<div class="card mt m">No tasks here yet. Add one to get started.</div>'}
/* work */
let WV='day';const WF=[{k:'title',l:'Title',r:1},{k:'type',l:'Type',t:'select',o:['Office hours','Meeting','Break','Deadline','Project task','Reminder']},{k:'date',l:'Date',t:'date',r:1},{k:'start',l:'Start',t:'time',r:1},{k:'end',l:'End',t:'time'},{k:'repeat',l:'Repeat',t:'select',o:['None','Daily','Weekdays (Sun–Thu)','Weekly']},{k:'rem',l:'Notify at start',t:'check'}];

/* routines */
const RF=[{k:'name',l:'Routine name',r:1},{k:'start',l:'Start time',t:'time',r:1},{k:'days',l:'Repeat days',t:'days'}];
const editR=id=>edit('routines',id,RF,{start:'06:00',days:[0,1,2,3,4,5,6]},'Routine',o=>{if(!id)o.steps=[]});
function rs(rid,sid,act){const r=S.routines.find(x=>x.id===rid),i=r.steps.findIndex(s=>s.id===sid),s=r.steps[i],td=ymd(nowD());
if(act==='t')s.done=s.done===td?'':td;if(act==='p')s.off=!s.off;if(act==='d')r.steps.splice(i,1);if(act==='e'){const v=prompt('Edit step',s.t);if(v&&v.trim())s.t=v.trim()}
if(act==='u'&&i>0)[r.steps[i-1],r.steps[i]]=[s,r.steps[i-1]];if(act==='n'&&i<r.steps.length-1)[r.steps[i+1],r.steps[i]]=[s,r.steps[i+1]];save();render()}
function rstep(e,rid){e.preventDefault();const v=e.target.s.value.trim();if(v){S.routines.find(x=>x.id===rid).steps.push({id:uid(),t:v});save();render()}return false}
/* study timer */
const el=()=>S.tm.acc+(S.tm.run?Date.now()-S.tm.start:0),tgt=()=>{const T=S.tm;return(T.mode==='cd'?T.cdm:T.mode==='sw'?0:T.phase==='study'?T.dur:T.phase==='short'?T.sb:T.lb)*6e4};
function sgo(){const T=S.tm;if(T.run){T.acc=el();T.run=false}else{T.start=Date.now();T.run=true}save();render()}
function sreset(){S.tm.acc=0;S.tm.run=false;save();render()}
function smode(m){S.tm={...S.tm,mode:m,acc:0,run:false,phase:'study'};save();render()}
function sset(k,v){S.tm[k]=Math.max(1,+v||1);S.tm.acc=0;S.tm.run=false;save();render()}
function ssave(){const s=Math.round(el()/1e3);if(s<1)return;const n=nowD();S.study.push({id:uid(),d:ymd(n),t:hm(n),sec:s,mode:'sw'});S.tm.acc=0;S.tm.run=false;save();render()}
function startS(){go('study');if(!S.tm.run)sgo()}
function studyTick(){const T=S.tm;if(!T.run||T.mode==='sw'||el()<tgt())return;const n=nowD();T.run=false;
if(T.mode==='cd'||T.phase==='study'){S.study.push({id:uid(),d:ymd(n),t:hm(n),sec:Math.round(tgt()/1e3),mode:T.mode});notify('study','Study session complete','Great work!')}else notify('study','Break over','Back to focus')
if(T.mode==='pomo'){if(T.phase==='study'){T.cnt++;T.phase=T.cnt%4===0?'long':'short'}else T.phase='study'}T.acc=0;save();if(page==='study')render()}
function studyLive(){const x=document.getElementById('tt');if(!x)return;const T=S.tm,e=el(),tg=tgt(),s=T.mode==='sw'?Math.floor(e/1e3):Math.max(0,Math.ceil((tg-e)/1e3));x.textContent=(s>=3600?Math.floor(s/3600)+':':'')+pad(Math.floor(s/60)%60)+':'+pad(s%60);const rc=document.getElementById('rc');if(rc)rc.style.strokeDashoffset=565.5*(1-Math.min(T.mode==='sw'?(e%6e4)/6e4:e/tg,1))}

const CAL={v:'month',d:ymd(nowD())};
const bars=(v,l,u)=>{const mx=Math.max(...v,1);return`<svg viewBox="0 0 280 130" width="100%" role="img" aria-label="${v.map((x,i)=>l[i]+': '+x+u).join(', ')}">${v.map((x,i)=>{const h=Math.round(x/mx*80);return`<rect x="${i*40+8}" y="${100-h}" width="24" height="${h}" rx="5" fill="var(--p)"/><text x="${i*40+20}" y="${94-h}" text-anchor="middle" font-size="10" fill="var(--t)">${x}</text><text x="${i*40+20}" y="118" text-anchor="middle" font-size="10" fill="var(--m)">${l[i]}</text>`}).join('')}</svg>`};

const PAGES={

return`<section class="card hero"><div><div class="m" id="dt"></div><h2 style="margin:4px 0 2px;font-size:26px">${greet()}, ${esc(S.name)}!</h2><div class="m">Plan Your Time. Live Your Purpose.</div><div class="big mt" id="clk" style="font-size:36px"></div><div class="row mt"><button class="btn pri" onclick="editA()">${ic('plus')}${tr('Add Alarm','অ্যালার্ম যোগ')}</button><button class="btn" onclick="startS()">▶ ${tr('Start Study','পড়া শুরু')}</button><button class="btn" onclick="editT()">${ic('plus')}${tr('Add Task','টাস্ক যোগ')}</button><button class="btn" onclick="go('prayer')">${ic('moon')}${tr('Prayer Times','নামাজের সময়')}</button></div></div>

<div class="g mt">${cardS('bell',tr('Next alarm','পরবর্তী অ্যালার্ম'),'<span id="na"></span>','<span id="nal"></span>')}${cardS('moon',tr('Next prayer','পরবর্তী নামাজ'),'<span id="np"></span>','<span id="npl"></span>')}${cardS('check',tr('Tasks today','আজকের টাস্ক'),dn+' / '+tk.length,tr('completed','সম্পন্ন'))}${cardS('timer',tr('Study today','আজকের পড়া'),Math.round(st/60)+' min',`<progress max="${S.goal*60}" value="${st}" aria-label="Study goal"></progress>`)}</div>

${S.alarms.length?[...S.alarms].sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<div class="card row mt"><div class="sp"><div class="big">${fmtT(a.time)}</div><div class="m">${esc(a.label||'Alarm')} · ${a.rep}${a.rep==='Custom'?' ('+a.days.map(d=>DAYS[d]).join(', ')+')':''}${a.rep==='Once'?' · '+a.date:''}${a.snz?' · snoozed':''}</div></div>${sw(a.on,`atog('${a.id}')`,'Enable alarm')}<button class="ib" aria-label="Edit" onclick="editA('${a.id}')">✎</button><button class="ib dg" aria-label="Delete" onclick="del('alarms','${a.id}')">${ic('trash')}</button></div>`).join(''):'<div class="card mt m">No alarms yet.</div>'}`},

<div style="position:relative;width:min(70vw,260px);margin:10px auto"><svg viewBox="0 0 200 200" width="100%" aria-hidden="true"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--b)" stroke-width="10"/><circle id="rc" cx="100" cy="100" r="90" fill="none" stroke="var(--p)" stroke-width="10" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="565.5" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset 1s linear"/></svg><div id="tt" class="big" role="timer" style="position:absolute;inset:0;display:grid;place-items:center;font-size:40px"></div></div>

work(){const d=ymd(nowD()),n=nowD(),days=Array.from({length:WV==='week'?7:1},(_,i)=>ymd(addD(n,i)));return`<div class="row"><button class="btn pri" onclick="editW()">${ic('plus')}Add event</button>${['day','week'].map(v=>`<button class="btn ${WV===v?'on':''}" aria-pressed="${WV===v}" onclick="WV='${v}';render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>${agenda(days,['W'])}<div class="card mt"><b>All work events</b>${S.work.length?S.work.map(w=>`<div class="row"><span class="sp">${esc(w.title)} <span class="m">${w.type} · ${w.date} ${fmtT(w.start)}${w.end?'–'+fmtT(w.end):''} · ${w.repeat}</span></span><button class="ib" aria-label="Edit" onclick="editW('${w.id}')">✎</button><button class="ib dg" aria-label="Delete" onclick="del('work','${w.id}')">${ic('trash')}</button></div>`).join(''):'<div class="m">No work events yet.</div>'}</div>`},
routines(){const td=ymd(nowD());return`<button class="btn pri" onclick="editR()">${ic('plus')}New routine</button>${S.routines.length?S.routines.map(r=>`<div class="card mt"><div class="row"><b class="sp">${esc(r.name)}${r.paused?' <span class="bd">Paused</span>':''}</b><span class="m">${fmtT(r.start)} · ${r.days.map(d=>DAYS[d]).join(' ')}</span><button class="btn" onclick="S.routines.find(x=>x.id==='${r.id}').paused=!${!!r.paused};save();render()">${r.paused?'Resume':'Pause'}</button><button class="ib" aria-label="Edit" onclick="editR('${r.id}')">✎</button><button class="ib dg" aria-label="Delete" onclick="del('routines','${r.id}')">${ic('trash')}</button></div>
${r.steps.map(s=>`<div class="row"><button class="ck" role="checkbox" aria-checked="${s.done===td}" aria-label="Done: ${esc(s.t)}" onclick="rs('${r.id}','${s.id}','t')">${s.done===td?'✓':''}</button><span class="sp ${s.off?'past':''} ${s.done===td?'dn':''}">${esc(s.t)}${s.off?' (paused)':''}</span><button class="ib" aria-label="Move up" onclick="rs('${r.id}','${s.id}','u')">↑</button><button class="ib" aria-label="Move down" onclick="rs('${r.id}','${s.id}','n')">↓</button><button class="ib" aria-label="Pause step" onclick="rs('${r.id}','${s.id}','p')">⏸</button><button class="ib" aria-label="Edit step" onclick="rs('${r.id}','${s.id}','e')">✎</button><button class="ib dg" aria-label="Delete step" onclick="rs('${r.id}','${s.id}','d')">${ic('trash')}</button></div>`).join('')}
<form class="row" onsubmit="return rstep(event,'${r.id}')"><input class="sp" name="s" placeholder="Add a step" aria-label="New step"><button class="btn">Add</button></form></div>`).join(''):'<div class="card mt m">No routines yet. Try “Morning Routine” or “Study Routine”.</div>'}`},
cal(){const c=CAL,d=toD(c.d),y=d.getUTCFullYear(),mo=d.getUTCMonth();let body;
if(c.v==='month'){const f=new Date(Date.UTC(y,mo,1)),off=(f.getUTCDay()-S.fdw+7)%7,cells=[];for(let i=0;i<42;i++){const x=addD(f,i-off),ds=ymd(x),it=itemsOn(ds),ks=[...new Set(it.map(i=>i.k))];cells.push(`<button class="cl ${x.getUTCMonth()!==mo?'oth':''} ${ds===c.d?'sel':''}" aria-label="${ds}: ${it.length} items" onclick="CAL.d='${ds}';render()">${x.getUTCDate()}<span>${ks.map(k=>`<i class="kd k${k}">${k}</i>`).join('')}</span></button>`)}
body=`<div class="cal">${Array.from({length:7},(_,i)=>`<b>${DAYS[(i+S.fdw)%7]}</b>`).join('')}${cells.join('')}</div>${legend}${agenda([c.d])}`}
else{const st=c.v==='week'?addD(d,-((d.getUTCDay()-S.fdw+7)%7)):d;body=agenda(Array.from({length:c.v==='week'?7:1},(_,i)=>ymd(addD(st,i))))}
return`<div class="row">${['month','week','day'].map(v=>`<button class="btn ${c.v===v?'on':''}" aria-pressed="${c.v===v}" onclick="CAL.v='${v}';render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}<span class="sp"></span><button class="ib" aria-label="Previous" onclick="cstep(-1)">‹</button><b>${c.v==='month'?d.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}):c.d}</b><button class="ib" aria-label="Next" onclick="cstep(1)">›</button></div><div class="row"><button class="btn pri" onclick="editT(null,{date:'${c.d}'})">${ic('plus')}Task on ${c.d}</button><button class="btn" onclick="editW(null,{date:'${c.d}'})">${ic('plus')}Work event</button><button class="btn" onclick="editA()">${ic('plus')}Alarm</button></div>${body}`},
stats(){const n=nowD(),ds=ymd(n),days=Array.from({length:7},(_,i)=>ymd(addD(n,i-6))),sv=days.map(d=>Math.round(ssum(d)/60)),tv=days.map(d=>S.tasks.filter(k=>k.doneAt===d).length),lb=days.map(d=>DAYS[toD(d).getUTCDay()]),
tot=S.study.reduce((x,s)=>x+s.sec,0),mo=S.study.filter(s=>s.d.slice(0,7)===ds.slice(0,7)).reduce((x,s)=>x+s.sec,0),done=S.tasks.filter(k=>k.done).length;let streak=0;for(let i=0;i<400;i++){if(ssum(ymd(addD(n,-i)))>0)streak++;else if(i>0)break;else continue}
return`<div class="g"><div class="card"><div class="m">Total study</div><div class="big">${(tot/3600).toFixed(1)} h</div></div><div class="card"><div class="m">Last 7 days</div><div class="big">${(sv.reduce((a,b)=>a+b,0)/60).toFixed(1)} h</div></div><div class="card"><div class="m">This month</div><div class="big">${(mo/3600).toFixed(1)} h</div></div><div class="card"><div class="m">Study streak</div><div class="big">${streak} day${streak===1?'':'s'}</div></div><div class="card"><div class="m">Tasks completed</div><div class="big">${done}</div></div><div class="card"><div class="m">Overdue</div><div class="big">${S.tasks.filter(isOver).length}</div></div><div class="card"><div class="m">Completion rate</div><div class="big">${S.tasks.length?Math.round(done/S.tasks.length*100):0}%</div></div></div>
<div class="g mt"><div class="card"><b>Study minutes per day</b>${bars(sv,lb,' min')}</div><div class="card"><b>Tasks completed per day</b>${bars(tv,lb,'')}</div></div>${S.study.length||S.tasks.length?'':'<div class="card mt m">Charts fill in as you study and complete tasks.</div>'}`},
set(){const ns=window.Notification?Notification.permission:'unsupported';return`<div class="g"><div class="card"><b>General</b><label>Your name<input value="${esc(S.name)}" onchange="sv('name',this.value)"></label><label>Language</label>${sel([['bn','বাংলা'],['en','English']],S.lang,"sv('lang',this.value)")}<label>Timezone</label>${sel([[6,'Asia/Dhaka (UTC+6)'],[5.5,'Asia/Kolkata (UTC+5:30)'],[3,'Asia/Riyadh (UTC+3)'],[8,'Asia/Kuala_Lumpur (UTC+8)'],[0,'UTC']],S.off,"sv('off',+this.value)")}<label>Time format</label>${sel([[0,'12-hour'],[1,'24-hour']],+S.h24,"sv('h24',this.value==1)")}<label>First day of week</label>${sel([[6,'Saturday'],[0,'Sunday'],[1,'Monday']],S.fdw,"sv('fdw',+this.value)")}<label>Daily study goal (min)<input type="number" min="1" value="${S.goal}" onchange="sv('goal',+this.value||120)"></label></div>
<div class="card"><b>Appearance</b><label>Theme</label>${sel([['system','System'],['light','Light'],['dark','Dark']],S.theme,"sv('theme',this.value)")}<br><b>Notifications</b><div class="row mt"><span class="sp">Browser notifications: <b>${ns}</b></span><button class="btn" onclick="askN()">Enable</button></div>${ns==='denied'?'<div class="m">Blocked in browser settings; in-app notifications still work.</div>':''}<div class="row"><span class="sp">Sound</span>${sw(S.sound,"sv('sound',!S.sound)",'Sound')}</div><label>Notification sound</label><div class="row"><div class="sp">${sel(Object.keys(SND),S.nsnd,"sv('nsnd',this.value)")}</div><button class="btn" onclick="beep(S.nsnd)">▶ Preview</button></div>${['alarm','prayer','task','study','work','routine'].map(c=>`<div class="row"><span class="sp">${c[0].toUpperCase()+c.slice(1)} notifications</span>${sw(S.cats[c]!==false,`S.cats.${c}=S.cats.${c}===false;save();render()`,c)}</div>`).join('')}</div>
<div class="card"><b>Data</b><div class="m">Saved in this browser only (localStorage). Cloud sign-in and sync are not part of this standalone version.</div><div class="row mt"><button class="btn" onclick="expo()">Export JSON</button><button class="btn" onclick="impo()">Import JSON</button><button class="btn dg" onclick="clr()">Clear all data</button></div></div></div>`},
more(){return`<div class="g">${NAV.filter(([p])=>!BN.includes(p)).map(([p,i])=>`<a class="card row" style="text-decoration:none;color:inherit;min-height:60px" href="#${p}">${ic(i)}<b>${t(p)}</b></a>`).join('')}</div>`}};
/* actions */
function go(p){location.hash=p}
function sv(k,v){S[k]=v;save();render()}
function psel(k,v){S.pray[k]=v;if(k==='city'&&CT[v]){S.pray.lat=CT[v][0];S.pray.lng=CT[v][1]}save();render()}
function ptog(x){S.pray.on[x]=!S.pray.on[x];save();render()}
function cstep(n){const d=toD(CAL.d);CAL.d=ymd(CAL.v==='month'?new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1)):addD(d,n*(CAL.v==='week'?7:1)));render()}
function expo(){dlg(`<h2 style="margin:0;font-size:18px">Export</h2><div class="m">Copy this JSON and keep it somewhere safe.</div><textarea readonly rows="10" onfocus="this.select()" aria-label="Export data">${esc(JSON.stringify(S,null,1))}</textarea><div class="row mt"><button class="btn" data-x>Close</button></div>`)}
function impo(){dlg(`<h2 style="margin:0;font-size:18px">Import</h2><div class="m">Paste exported JSON. Your current data is backed up first.</div><textarea id="ij" rows="10" aria-label="Import data"></textarea><div class="row mt"><button class="btn pri" onclick="imp()">Import</button><button class="btn" data-x>Cancel</button></div>`)}
function imp(){try{const o=JSON.parse($('#ij').value);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;localStorage.setItem('timeniq_prev',JSON.stringify(S));S={...DEF,...o};fix();save();document.querySelector('dialog').close();render();toast('Imported. Previous data backed up.')}catch(e){toast('Invalid JSON, nothing changed')}}
function clr(){if(confirm('Delete ALL TimeNiq data in this browser?')){try{localStorage.setItem('timeniq_prev',JSON.stringify(S))}catch(e){}S={...DEF};fix();save();render()}}
function nc(){dlg(`<h2 style="margin:0;font-size:18px">Notifications</h2>${S.notes.length?S.notes.map(n=>`<div class="row"><span class="bd">${n.cat}</span><span class="sp"><b>${esc(n.title)}</b> <span class="m">${esc(n.body||'')} · ${new Date(n.ts).toLocaleTimeString()}</span></span></div>`).join(''):'<div class="m">No notifications yet.</div>'}<div class="row mt"><button class="btn dg" onclick="S.notes=[];save();document.querySelector('dialog').close();render()">Clear all</button><button class="btn" data-x>Close</button></div>`)}
const applyTheme=()=>{document.documentElement.dataset.t=S.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):S.theme;document.documentElement.lang=S.lang};
let page=location.hash.slice(1)||'dash';
function render(){applyTheme();const P=PAGES[page]?page:'dash',lk=(p,i,c)=>`<a href="#${p}" ${p===P||(p==='more'&&!BN.includes(P))?'aria-current="page"':''}>${ic(i)}<span class="${c}">${t(p)}</span></a>`;
$('#app').innerHTML=`<aside class="sb ${S.col?'col':''}" aria-label="Sidebar"><div class="row" style="padding:6px 12px 14px"><b class="lb" style="color:var(--p);font-size:20px">TimeNiq</b></div>${NAV.map(([p,i])=>lk(p,i,'lb')).join('')}<div class="m lb" style="margin-top:auto;padding:10px 12px">© Sujon · Developer</div></aside><div class="mn"><header><button class="ib dsk" aria-label="Toggle sidebar" onclick="sv('col',!S.col)">☰</button><h1>${P==='dash'?'TimeNiq':t(P)}</h1><button class="ib" aria-label="Toggle theme" onclick="sv('theme',document.documentElement.dataset.t==='dark'?'light':'dark')">${ic(document.documentElement.dataset.t==='dark'?'sun':'moon')}</button><button class="ib" aria-label="Notifications (${S.notes.length})" onclick="nc()">${ic('bell')}${S.notes.length?`<span class="bd" style="margin-left:2px">${S.notes.length}</span>`:''}</button></header><main id="pg">${PAGES[P]()}<div class="ft">© ${new Date().getFullYear()} Sujon · Developer of TimeNiq</div></main></div><nav class="bn" aria-label="Main">${BN.map(p=>lk(p,NAV.find(x=>x[0]===p)[1],'')).join('')}${lk('more','more','')}</nav>`;live()}
function live(){const n=nowD(),s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};s('clk',clkTxt());s('dt',n.toLocaleDateString(S.lang==='bn'?'bn-BD':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}));
const a=nextA();s('na',a?cd(a.ms-n):'—');s('nal',a?(a.a.label||'Alarm')+' · '+fmtT(a.a.time):'No alarms set');const p=nextP();s('np',cd(p.ms-n));s('npl',pn(p.n)+' · '+fmtT(p.t));studyLive()}
function tick(){const n=nowD(),ds=ymd(n),t=hm(n),dow=n.getUTCDay();
S.alarms.forEach(a=>{if(a.snz&&Date.now()>=a.snz){a.snz=0;ring(a)}const key=ds+' '+t;if(a.on&&a.time===t&&occ(a,ds)&&a.last!==key){a.last=key;ring(a)}});
S.tasks.forEach(k=>{if(!k.done&&k.rem&&k.date===ds&&k.time===t)notify('task','Task due: '+k.title,'',  'T'+k.id+ds+t)});
S.work.forEach(w=>{if(w.rem&&wocc(w,ds)&&w.start===t)notify('work',w.title,w.type+' starts now','W'+w.id+ds+t)});
S.routines.forEach(r=>{if(!r.paused&&r.start===t&&r.days.includes(dow))notify('routine',r.name,'Time to start','R'+r.id+ds+t)});
const P=ptimes(ds);if(P)PN.forEach(x=>{if(S.pray.on[x]&&toMin(P[x])-S.pray.adv===toMin(t))notify('prayer',pn(x),S.pray.adv?'in '+S.pray.adv+' min':'now','P'+x+ds)});
studyTick();live()}
window.onhashchange=()=>{page=location.hash.slice(1)||'dash';render();scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();setInterval(tick,1000);
</script></body></html>
